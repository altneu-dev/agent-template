name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Everything that needs no container. Fast, and it is where most mistakes surface.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Scripts parse
        run: |
          set -e
          for f in bin/* ci/* examples/*/bin/*; do
            [ -f "$f" ] || continue
            case "$f" in *.ts) continue;; esac
            # `compile()` rather than py_compile: py_compile writes a __pycache__ directory
            # next to the source, which the same glob then picks up as a "script" on the next
            # run. A syntax check that mutates the tree it is checking is one you cannot run
            # twice, and it fails second in a way that looks like a real defect.
            if head -1 "$f" | grep -q python; then
              python3 -c 'import sys; compile(open(sys.argv[1]).read(), sys.argv[1], "exec")' "$f"
            else bash -n "$f"; fi
          done
          echo "all scripts parse"

      - name: No values in .env.example
        run: |
          # It is committed, so a real credential here is public the moment it lands. Names and
          # non-secret defaults only; <required> marks what an operator must supply.
          if grep -vE '^\s*(#|$)' .env.example | grep -qiE '(sk-[A-Za-z0-9]{20}|ghp_[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16})'; then
            echo "a credential-shaped value is committed in .env.example"; exit 1
          fi
          echo ".env.example carries no values"

      - name: Install the runtime, as the image does
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npm install -g --ignore-scripts \
            "@earendil-works/pi-coding-agent@$(grep -oP 'ARG PI_VERSION=\K[0-9.]+' Dockerfile)"

      - name: The readiness probe writes nothing
        run: |
          set -e
          # agent-init --check is the healthcheck's neighbour. A probe that mutates state is
          # one you cannot run twice, and it would also fabricate boot records.
          d=$(mktemp -d)
          AGENT_APP="$PWD" AGENT_DATA="$d" bin/agent-init --check >/dev/null 2>&1 || true
          if [ -n "$(find "$d" -type f 2>/dev/null)" ]; then
            echo "agent-init --check wrote something:"; find "$d" -type f; exit 1
          fi
          echo "--check is read-only"

      - name: compose.yml has the shape a platform needs
        run: |
          set -e
          docker compose config --format json > /tmp/compose.json
          python3 - <<'EOF'
          import json, re
          c = json.load(open('/tmp/compose.json'))
          svc = c['services']['agent']

          assert not svc.get('ports'), "this agent reaches out; nothing reaches in"
          assert svc.get('read_only') is True, "read_only was dropped"

          data = [v for v in svc.get('volumes', []) if v.get('target') == '/data']
          assert len(data) == 1, f"/data must be mounted exactly once: {data}"
          assert data[0]['type'] == 'volume', "/data must be a named volume, not a bind"


          # A variable the compose file does not name never reaches the container. This
          # catches the reverse mistake: naming one that nothing documents.
          #
          # A commented declaration counts as documented. Optional variables are listed
          # commented out on purpose — uncommenting OPENAI_API_KEY=<required> would make it
          # mandatory for every deployment that does not use OpenAI.
          named = set(svc.get('environment', {}))
          documented = set(re.findall(r'^\s*#?\s*([A-Za-z_][A-Za-z0-9_]*)=',
                                      open('.env.example').read(), re.M))
          undocumented = named - documented - {'SOURCE_COMMIT', 'AGENT_ENV'}
          assert not undocumented, f"named in compose but absent from .env.example: {undocumented}"
          print("compose shape ok")
          EOF

          # The volume declaration is checked against the SOURCE file, not the rendered model:
          # `docker compose config` normalises and always emits a project-prefixed `name:`, so
          # the rendered form can never satisfy this. What matters is what we declare.
          python3 - <<'EOF'
          import yaml
          vol = (yaml.safe_load(open('compose.yml')).get('volumes') or {}).get('agent-data') or {}
          assert not vol.get('name') and not vol.get('external'), \
              "never pin the volume name — the platform derives it and ignores this (Coolify #3954)"
          print("volume declaration ok")
          EOF

      # The gate. Installs each example vertical and fails if a framework file moved, then
      # asks pi itself what tool surface each job really gets. Needs no credentials: the probe
      # extension reports on session_start, before any model request.
      - name: Universality gate
        run: ci/universality-test.sh

      # The other gate. Everything agent-run does after the model returns — judging the
      # outcome, checking the contract, choosing an exit code — needs a real run to reach, so
      # it runs against a test double placed on PATH. Those paths decide whether a client's
      # deployment reports "done" or "the agent lied"; untested, they are the ones that turn
      # out not to work.
      - name: Outcome contracts
        run: ci/contract-test.sh

      # The action ledger answers "what did the agent change in our systems". Two properties
      # have to hold or it is worse than nothing, because it would look complete while missing
      # things: every call leaves a record, and a call that cannot be recorded does not happen.
      - name: The action ledger
        run: ci/effects-test.sh

  # The half that cannot be checked without a container — including the one property the whole
  # design rests on.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t agent-template:ci .

      - name: The harness works inside the image
        run: |
          set -e
          # Output is captured rather than piped: `| grep -q` closes the pipe as soon as it
          # matches, and the container process then dies of SIGPIPE mid-write, which shows up
          # as "broken pipe" noise next to a real failure.
          run() { docker run --rm -v ci-data:/data agent-template:ci "$@"; }

          # The deploy checklist must be IN the image. Without it agent-secret cannot say what
          # this deployment requires and preflight approves an unconfigured container — the
          # bug this job caught on its first run.
          run test -f /app/.env.example

          # A login shell is what `docker compose exec agent bash -l` gives you, and it
          # rebuilds PATH from /etc/profile. Asserted separately from direct exec because the
          # two resolve PATH by different mechanisms and only one of them was ever right.
          run sh -lc 'command -v agent-run >/dev/null && command -v kb >/dev/null'

          run agent-init --check
          run agent-run --list

          # An unfinished deployment must SAY so rather than idling healthy and silent, which
          # is how a half-finished fork fails at a client. No credentials exist in CI, so this
          # always has at least one thing to report.
          if run agent-status --ready; then
            echo "expected an unconfigured deployment to report itself not ready"; exit 1
          fi
          ready=$(run agent-status --ready || true)
          [ -n "$ready" ] || { echo "--ready failed without saying why"; exit 1; }

          # What it must name depends on what THIS image actually contains. Asserting the bare
          # template's wording would fail on every fork branch — and a fork is what a client
          # deployment is, so the test would be red for everyone it is supposed to protect.
          if [ -n "$(run agent-run --list | grep 'no jobs defined')" ]; then
            echo "$ready" | grep -q "no jobs"    || { echo "--ready did not name the missing jobs"; exit 1; }
            echo "$ready" | grep -q "no context" || { echo "--ready did not name the missing context"; exit 1; }
            echo "readiness: the bare framework names its missing jobs and context"
          else
            echo "$ready" | grep -q "not configured" \
              || { echo "--ready did not name the missing credentials"; exit 1; }
            echo "readiness: this fork is filled in, and names its missing credentials"
          fi
          echo "$(run agent-mcp check)"  | grep -q "no MCP servers configured"
          echo "$(run kb schema)"        | grep -q "SQLite FTS5"

          # An unconfigured deployment must refuse before spending anything, and name the
          # variable rather than failing somewhere inside a run.
          if run agent-secret check -q; then
            echo "expected an unconfigured deployment to fail preflight"; exit 1
          fi
          echo "$(run agent-secret check || true)" | grep -q ANTHROPIC_API_KEY
          echo "harness ok"

      # THE test. /data is the agent's memory; if a redeploy loses it the agent forgets
      # everything, and every other guarantee in this repo is worth nothing. Recreating the
      # container while keeping the volume is exactly what a platform does on `git push`.
      - name: Memory survives a redeploy
        run: |
          set -e
          run() { docker run --rm -v ci-data:/data agent-template:ci "$@"; }

          run sh -lc 'kb add "survives a redeploy" </dev/null >/dev/null && kb index >/dev/null'
          BEFORE_ID=$(run agent-status --memory --json | python3 -c 'import json,sys;print(json.load(sys.stdin)["volume_id"])')
          BEFORE_BUILD=$(run cat /app/.build-id)

          # The image content must actually CHANGE, or the second build is byte-identical and
          # cannot demonstrate a redeploy — only a restart. The workspace is disposable.
          echo "" >> agent/context/README.md
          docker rm -f $(docker ps -aq --filter ancestor=agent-template:ci) 2>/dev/null || true
          docker rmi -f agent-template:ci
          docker build -q -t agent-template:ci .

          AFTER_BUILD=$(run cat /app/.build-id)
          [ "$BEFORE_BUILD" != "$AFTER_BUILD" ] || { echo "build id did not change: not a redeploy"; exit 1; }

          # The real memory path, not the evidence about it.
          run sh -lc 'kb search "survives redeploy"' | grep -q "survives a redeploy"

          # And the deployment says so about itself.
          run agent-status --memory --json > /tmp/mem.json
          python3 - "$BEFORE_ID" <<'EOF'
          import json, sys
          d = json.load(open('/tmp/mem.json'))
          assert d["volume_id"] == sys.argv[1], f'volume changed: {d["volume_id"]} != {sys.argv[1]}'
          assert d["survived_redeploy"] is True, d
          assert d["builds"] >= 2, d
          print("self-reported:", d["state"], "| boots", d["boots"], "| builds", d["builds"])
          EOF
          echo "memory survived an image rebuild and a new container"

      # A mechanism that cannot say "I have no evidence" is worthless — it would report every
      # freshly wiped volume as healthy. These run on their own volumes so the counts are exact.
      - name: A deployment can prove — and disprove — its own persistence
        run: |
          set -e
          v1=prove-$RANDOM; v2=prove-$RANDOM
          on() { docker run --rm -v "$1":/data agent-template:ci "${@:2}"; }

          echo "== a fresh volume must report unproven, and exit 1 =="
          on $v1 agent-status --memory --json > /tmp/a.json && { echo "expected exit 1"; exit 1; }
          python3 -c '
          import json; d=json.load(open("/tmp/a.json"))
          assert d["boots"]==1 and d["state"]=="unproven", d
          assert d["survived_restart"] is False and d["survived_redeploy"] is False, d
          print("  fresh volume: unproven, as it must be")'
          ORIGIN=$(on $v1 cat /data/logs/origin.json)
          ID1=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["volume_id"])' "$ORIGIN")

          echo "== repeated agent-init inside ONE container adds no boots =="
          # Measured as a delta within a single container: every `docker run` is a new
          # container and so is a legitimate new boot. What must not happen is agent-run's
          # preflight inflating the count on each call.
          delta=$(on $v1 sh -lc '
            a=$(wc -l < /data/logs/boots.jsonl)
            agent-init >/dev/null; agent-init >/dev/null; agent-init >/dev/null
            b=$(wc -l < /data/logs/boots.jsonl); echo $((b-a))')
          [ "$delta" = 0 ] || { echo "three extra inits added $delta boot line(s)"; exit 1; }
          echo "  dedup holds: 3 further inits added 0 boots"

          echo "== same volume, another container: restart proven, redeploy not =="
          on $v1 agent-status --memory --json > /tmp/b.json || true
          python3 - "$ID1" <<'EOF'
          import json, sys
          d = json.load(open("/tmp/b.json"))
          assert d["volume_id"] == sys.argv[1], f'volume identity changed: {d}'
          assert d["boots"] >= 2, d
          assert d["survived_restart"] is True, d
          assert d["survived_redeploy"] is False, "same image is not a redeploy"
          print("  restart proven over", d["boots"], "boots; redeploy correctly still unproven")
          EOF

          echo "== a different volume is a different identity =="
          on $v2 agent-status --memory --json > /tmp/c.json || true
          python3 -c '
          import json,sys; d=json.load(open("/tmp/c.json"))
          assert d["volume_id"] != sys.argv[1], "a new volume reused an identity"
          assert d["state"]=="unproven", d
          print("  new volume:", d["volume_id"], "!= ", sys.argv[1])' "$ID1"

          echo "== origin.json is never rewritten =="
          [ "$(on $v1 cat /data/logs/origin.json)" = "$ORIGIN" ] || { echo "origin.json changed"; exit 1; }

          echo "== /data is empty in the image =="
          # Docker seeds a NEW named volume from image content at the mount path. Anything
          # shipped in /data would be inherited by every fresh volume and fake a history.
          docker run --rm --entrypoint /bin/sh agent-template:ci -c '[ -z "$(ls -A /data)" ]'

          docker volume rm -f $v1 $v2 >/dev/null 2>&1 || true
          echo "persistence evidence is trustworthy in both directions"

      - name: No credentials in the image
        run: |
          if docker history --no-trunc agent-template:ci \
             | grep -qiE "sk-[A-Za-z0-9]{20}|ghp_[A-Za-z0-9]{20}"; then
            echo "credential-shaped string in image history"; exit 1
          fi
          echo "image history clean"
