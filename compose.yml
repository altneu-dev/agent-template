# One service, one volume. Coolify, Dokploy and plain `docker compose up` all read this,
# which is what keeps the deploy story to: point a platform at the repo, paste the env vars,
# click once.
services:
  agent:
    build:
      context: .
      args:
        AGENT_UID: "${AGENT_UID:-1000}"
        AGENT_GID: "${AGENT_GID:-1000}"
    restart: unless-stopped

    # THE line that matters. /data is the agent's memory — knowledge notes, run logs, work
    # area, pi sessions. A redeploy replaces the container and keeps this. Remove it and the
    # agent forgets everything every time you push.
    #
    # Never add `name:` or `external: true`: platforms that derive the real volume name from
    # the resource ignore both (Coolify issue #3954), so they buy nothing and read as a
    # guarantee that is not there. And never rename the service key or the volume key — the
    # derived name is built from them, so a rename orphans every existing deployment's
    # memory. ci/universality-test.sh freezes this file against verticals, which protects
    # that coupling by accident; this comment makes it deliberate.
    volumes:
      - agent-data:/data

    # A platform passes a variable to the container only if this file names it. That is plain
    # Compose semantics — `${VAR}` interpolation only touches variables the file references —
    # and it is why a key set in a deployment UI can appear correct and still never arrive.
    # A name missing from this list is a value an operator can set and watch do nothing.
    #
    # WRITTEN AS BARE `${VAR}`, NOT `${VAR:-}`. To Compose the two are identical: both become
    # an empty string when nothing is set. To a deployment UI they are not. Coolify reads this
    # file to decide which fields to offer, and renders a bare `${VAR}` as an editable empty
    # field but a `${VAR:-}` as nothing at all — so with the empty default there was no field
    # for ANTHROPIC_API_KEY anywhere in the UI, and the only clue was the container reporting
    # itself unconfigured. `docker compose` warns "variable is not set, defaulting to a blank
    # string" for each of these. That warning is the whole cost, and it buys an operator who
    # can see what this deployment wants without reading a compose file.
    #
    # TZ and AGENT_NAME keep real defaults, which a UI shows prefilled and editable.
    # SOURCE_COMMIT keeps an empty one on purpose: the platform supplies it, so a field an
    # operator could type into would be an invitation to lie to the boot record.
    #
    # Defaults are NOT repeated here. .env.example is the single source for them, and
    # agent-secret falls back to it; two places to change one default is how a committed
    # default silently stops applying. Empty is safe: agent-secret treats it as unset.
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      AGENT_NAME: "${AGENT_NAME:-agent}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      AGENT_PROVIDER: "${AGENT_PROVIDER}"
      AGENT_MODEL: "${AGENT_MODEL}"
      AGENT_RUN_TIMEOUT: "${AGENT_RUN_TIMEOUT}"
      AGENT_RUN_KEEP: "${AGENT_RUN_KEEP}"
      AGENT_RUN_ALERT_CMD: "${AGENT_RUN_ALERT_CMD}"
      # A vertical's own variables, as NAME=value lines. This file is frozen against
      # verticals but a platform will not pass a variable this file does not name, so one
      # field carries them all. agent-secret parses it with the same grammar as /data/.env.
      AGENT_ENV: "${AGENT_ENV}"
      # Recorded per boot when the platform provides it. A label; never load-bearing.
      SOURCE_COMMIT: "${SOURCE_COMMIT:-}"
      # V8's heap cap. The Dockerfile sets this too and explains why; it is repeated here
      # because a platform passes only what this file names, and an operator who needs to
      # retune it has nowhere else to type.
      #
      # THE DEFAULT IS REPEATED ON PURPOSE, against the rule above. Written bare, an unset
      # NODE_OPTIONS reaches the container as an empty string and empty OVERRIDES the image's
      # ENV — the cap would be silently removed by the very line that exists to carry it.
      # `${VAR:-}` would do the same. So this one spells its default out, like TZ, and a UI
      # shows it prefilled and editable. Keep it in step with mem_limit below.
      NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=768}"

    # Belt to the environment block's braces: for a plain `docker compose up` with a local
    # .env file. Delete these two lines if a platform's compose parser rejects the long
    # syntax — nothing depends on them once the variables above are named.
    env_file:
      - path: .env
        required: false

    # Nothing is published. This agent reaches out; nothing reaches in. Adding a port here
    # is the single easiest way to undo the containment story, so it is absent on purpose.

    # Guardrails that cost nothing and are absent from most compose files:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true          # /app is immutable at runtime; only /data and /tmp are writable
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 512
    # 4g, not 2g. A session is not one process: the harness, its MCP servers and the tools
    # they spawn are all charged to this cgroup, ~1 GB of them resident before any work
    # starts. At 2g a single long transcript reached the ceiling and the kernel killed the
    # largest task — CONSTRAINT_MEMCG, on a host with RAM to spare, with nothing in
    # `docker logs` and the container still reporting healthy.
    #
    # This number and NODE_OPTIONS above are one setting in two places. The cap is what makes
    # the failure catchable; the headroom is what keeps the siblings from being collateral.
    # Lowering this without lowering the cap re-arms the OOM killer.
    mem_limit: 4g
    # No mem_swappiness: cgroup v2 has no per-container swappiness, and runtimes either warn
    # and discard it or refuse to start. It bought almost nothing next to mem_limit, and the
    # cost was a one-click deploy dying on a client's box. Do not re-add it.
    cpus: 2.0
    ulimits:
      nofile: { soft: 4096, hard: 8192 }

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  agent-data:
